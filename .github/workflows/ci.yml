name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev > /tmp/bene-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ && break; sleep 1; done
      - name: Browser tests
        run: |
          npm run test:e2e
          npm run test:empty
          npm run test:backup
      - name: Offline PWA test
        run: |
          npm run preview > /tmp/bene-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ && break; sleep 1; done
          npm run test:pwa
