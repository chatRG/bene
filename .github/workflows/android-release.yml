name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "bene-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Bene ${{ github.ref_name }}
          generate_release_notes: true
          files: bene-*-debug.apk
          body: |
            Android debug APK for ${{ github.ref_name }}.

            - Installable on Android 6.0+ (`minSdk 23`).
            - Debug-signed, not Play Store-ready.
            - The web/PWA build is the same bundle; no network or account is required.
