name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bene-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bene-release.p12" >> "$GITHUB_ENV"

      - name: Build production APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "bene-${GITHUB_REF_NAME}-release.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Bene ${{ github.ref_name }}
          generate_release_notes: true
          files: bene-*-release.apk
          body: |
            Android release APK for ${{ github.ref_name }}.

            - Installable on Android 14+ (`minSdk 34`).
            - Release-signed with the project's production keystore.
            - The web/PWA build is the same bundle; no network or account is required.
