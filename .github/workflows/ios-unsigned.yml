# An unsigned iOS build for sideloading.
#
# An .ipa cannot be published signed: signing is bound to one developer's Apple
# identity and provisioning profile, so a signed build is only installable by
# that account. What can be published is the same app built without a signature,
# which AltStore, SideStore or Sideloadly re-sign on the user's own device with
# their own free Apple ID. This is the same approach the NOOP project uses.
name: iOS unsigned

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - run: bun install --frozen-lockfile

      - name: Build the web bundle into the iOS shell
        run: bun run build && bunx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build for device, unsigned, Release
        # Release, not Debug: a Debug build carries get-task-allow and fails
        # "integrity could not be verified" after re-signing on a device.
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "No .app produced"; exit 1; }

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          NAME="bene-${GITHUB_REF_NAME}-unsigned.ipa"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            NAME="bene-unsigned.ipa"
          fi
          zip -qr "$NAME" Payload
          echo "IPA=$NAME" >> "$GITHUB_ENV"
          ls -la "$NAME"

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA }}
          body: |
            Android APK and unsigned iOS IPA for ${{ github.ref_name }}.

            - **Android** — installable on Android 14+ (`minSdk 34`), release-signed.
            - **iOS** — unsigned. Install it with AltStore, SideStore or Sideloadly,
              which re-sign it on your device with your own Apple ID. There is no
              `.ipa` that installs without a signature; an App Store build needs an
              Apple Developer account and review.

      - uses: actions/upload-artifact@v4
        with:
          name: bene-ios-unsigned
          path: ${{ env.IPA }}
