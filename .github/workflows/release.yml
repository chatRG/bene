# One release, both platforms, one version.
#
# Pick the branch in the "Use workflow from" dropdown and run it. The version
# comes from package.json, the tag is created from it, and the APK and IPA land
# on a single GitHub release.
#
# This replaces the two per-platform workflows. They both built on a tag push,
# so with a workflow that creates its own tag they would have fired as well and
# raced to publish the same release.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      dry_run:
        description: Build both binaries but publish nothing
        type: boolean
        default: false

permissions:
  contents: write

# Two people releasing at once would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The version is decided once, here, and every other job reads it from this
  # job. Reading package.json in three places would let them disagree.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^ *"version": *"([^"]+)".*/\1/p' package.json | head -1)
          test -n "$VERSION" || { echo "::error::No version in package.json"; exit 1; }

          GRADLE_NAME=$(sed -nE 's/.*versionName "([^"]+)".*/\1/p' android/app/build.gradle | head -1)

          echo "package.json  $VERSION"
          echo "build.gradle  $GRADLE_NAME"

          # The APK reports versionName, the release is tagged from package.json.
          # If they disagree the install and the release tell different stories.
          if [ "$VERSION" != "$GRADLE_NAME" ]; then
            echo "::error::Version mismatch. package.json says $VERSION, android versionName says $GRADLE_NAME. Bump both in the release commit."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Android will not install an APK whose versionCode is not greater
          # than the installed one, and that failure is silent until someone
          # tries to update. Report it here rather than in the field.
          CODE=$(sed -nE 's/.*versionCode ([0-9]+).*/\1/p' android/app/build.gradle | head -1)
          test -n "$CODE" || { echo "::error::No versionCode found in android/app/build.gradle"; exit 1; }
          echo "versionCode   $CODE"

          if [ "${{ inputs.dry_run }}" != "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version in package.json and android/app/build.gradle, then run again."
            exit 1
          fi

  # Binaries are expensive and a broken tree should not get as far as a release.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  android:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bene-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bene-release.p12" >> "$GITHUB_ENV"

      - name: Build production APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cp android/app/build/outputs/apk/release/app-release.apk "bene-v${VERSION}-release.apk"
          ls -la "bene-v${VERSION}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bene-v${{ needs.prepare.outputs.version }}-release.apk

  ios:
    needs: [prepare, check]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - run: bun install --frozen-lockfile

      - name: Build the web bundle into the iOS shell
        run: bun run build && bunx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build for device, unsigned, Release
        # Release, not Debug: a Debug build carries get-task-allow and fails
        # "integrity could not be verified" after re-signing on a device.
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::No .app produced"; exit 1; }

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          NAME="bene-v${{ needs.prepare.outputs.version }}-unsigned.ipa"
          zip -qr "$NAME" Payload
          ls -la "$NAME"
          echo "IPA=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.IPA }}

  publish:
    needs: [prepare, android, ios]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-assets

      - name: List what will be published
        run: ls -la dist-assets/*/*

      - name: Create the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Bene ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: dist-assets/*/*
          body: |
            Android APK and unsigned iOS IPA for ${{ needs.prepare.outputs.tag }}.

            - **Android** — installable on Android 14+ (`minSdk 34`), release-signed.
              Installs over an earlier build of the same app.
            - **iOS** — unsigned. Install it with AltStore, SideStore or Sideloadly,
              which re-sign it on your device with your own Apple ID. No `.ipa`
              installs without a signature; an App Store build needs an Apple
              Developer account and review.

            Everything in the app runs offline. No account, no telemetry.
